# ==============================================================================
# Alembic Configuration for AgentOps
# ==============================================================================

[alembic]
# Path to migration environment scripts
script_location = migrations

# Prepend current directory to sys.path so app modules are resolvable
prepend_sys_path = .
path_separator = os

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Set to 'true' to run the environment during the 'revision' command
# regardless of whether autogenerate is True
# revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
