[project]
name = "agentops"
version = "0.1.0"
description = "Maintainable, secure-by-default, observable, self-hostable AI Agent Operations Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "langgraph>=0.2.40",
    "langchain-core>=0.3.0",
    "celery>=5.4.0,<6.0.0",
    "redis>=5.2.0,<6.0.0",
    "sqlalchemy>=2.0.36,<2.1.0",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "greenlet>=3.0.0",
    "alembic>=1.14.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=8.5.0",
    "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services/backend"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["services/backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["services/backend"]
markers = [
    "unit: Isolated unit tests running in memory without external services",
    "integration: Integration tests requiring database or message broker",
    "contract: Schema boundary and provider contract validation tests",
    "security: SSRF and security boundary validation tests",
    "e2e: End-to-end replay workflow tests",
    "evals: Repeatable agent evaluation benchmarks and edge cases",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["services/backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "kombu.*",
    "redis.*",
    "langgraph.*",
    "langchain_core.*",
    "structlog.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "app.agents.graph",
]
ignore_errors = true
