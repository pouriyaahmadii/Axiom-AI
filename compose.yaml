name: agentops

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: agentops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AGENTOPS_DB_USER: ${AGENTOPS_DB_USER:-agentops_user}
      AGENTOPS_DB_PASSWORD: ${AGENTOPS_DB_PASSWORD:-agentops_pass}
      AGENTOPS_DB_NAME: ${AGENTOPS_DB_NAME:-agentops_db}
      N8N_DB_USER: ${N8N_DB_USER:-n8n_user}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_pass}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    expose:
      - "5432"
    networks:
      - agentops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres_admin} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.2.6-alpine
    container_name: agentops_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - agentops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  n8n:
    image: n8nio/n8n:1.70.0
    container_name: agentops_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n_db}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n_pass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agentops-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Application services (Profile 'app'):
  # Kept dormant during infrastructure provisioning to prevent unbuilt container failures.
  # Boot with: docker compose --profile app up -d
  backend-api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: agentops_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - SYNC_DATABASE_URL=postgresql://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agentops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: agentops_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - SYNC_DATABASE_URL=postgresql://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - agentops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: agentops_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1
    networks:
      - agentops-net
    depends_on:
      - backend-api

networks:
  agentops-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
