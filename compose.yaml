name: agentops

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: agentops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      AGENTOPS_DB_USER: ${AGENTOPS_DB_USER:-agentops_user}
      AGENTOPS_DB_PASSWORD: ${AGENTOPS_DB_PASSWORD:-agentops_pass}
      AGENTOPS_DB_NAME: ${AGENTOPS_DB_NAME:-agentops_db}
      N8N_DB_USER: ${N8N_DB_USER:-n8n_user}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n_pass}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    expose:
      - "5432"
    networks:
      - agentops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres_admin} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  redis:
    image: redis:7.2.6-alpine
    container_name: agentops_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - agentops-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  n8n:
    image: n8nio/n8n:1.70.0
    container_name: agentops_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n_db}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n_user}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-n8n_pass}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agentops-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  backend-api:
    image: agentops-backend:latest
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: agentops_api
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_NAME=AgentOps
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - SYNC_DATABASE_URL=postgresql://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-mock}
      - MOCK_DETERMINISTIC_SEED=${MOCK_DETERMINISTIC_SEED:-42}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-llama3.2}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - API_KEY=${API_KEY:-agentops-dev-internal-key}
      - CORS_ORIGINS=["http://127.0.0.1:3000","http://localhost:3000"]
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/agentops-notifications}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-n8n_local_webhook_secret_for_hmac_verification}
      - MAX_PLAN_STEPS=${MAX_PLAN_STEPS:-10}
      - MAX_EXECUTION_SECONDS=${MAX_EXECUTION_SECONDS:-300}
      - STEP_TIMEOUT_SECONDS=${STEP_TIMEOUT_SECONDS:-60}
      - BUDGET_USD_LIMIT=${BUDGET_USD_LIMIT:-1.00}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - agentops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  backend-worker:
    image: agentops-backend:latest
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: agentops_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_NAME=AgentOps
      - DATABASE_URL=postgresql+asyncpg://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - SYNC_DATABASE_URL=postgresql://${AGENTOPS_DB_USER:-agentops_user}:${AGENTOPS_DB_PASSWORD:-agentops_pass}@postgres:5432/${AGENTOPS_DB_NAME:-agentops_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - SEARCH_PROVIDER=${SEARCH_PROVIDER:-mock}
      - MOCK_DETERMINISTIC_SEED=${MOCK_DETERMINISTIC_SEED:-42}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL_NAME=${OLLAMA_MODEL_NAME:-llama3.2}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - API_KEY=${API_KEY:-agentops-dev-internal-key}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/agentops-notifications}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-n8n_local_webhook_secret_for_hmac_verification}
      - MAX_PLAN_STEPS=${MAX_PLAN_STEPS:-10}
      - MAX_EXECUTION_SECONDS=${MAX_EXECUTION_SECONDS:-300}
      - STEP_TIMEOUT_SECONDS=${STEP_TIMEOUT_SECONDS:-60}
      - BUDGET_USD_LIMIT=${BUDGET_USD_LIMIT:-1.00}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
    networks:
      - agentops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; r = redis.Redis.from_url('redis://redis:6379/1'); r.ping()\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 256M

  frontend:
    image: agentops-frontend:latest
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: agentops_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000/api/v1}
    networks:
      - agentops-net
    depends_on:
      backend-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  # Optional Containerized Ollama Service (Activated only via `--profile ollama`)
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.4.4
    container_name: agentops_ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - agentops-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          memory: 1024M

networks:
  agentops-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  ollama_data:
